# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: build

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    - run: pnpm install --frozen-lockfile
    - run: pnpm build:prod
      env:
        CI: true
    # Runs here rather than with the unit tests: it measures dist/, which only
    # exists in this job.
    - name: Check first-paint budget
      run: pnpm check:size

    - name: Package release candidate
      if: matrix.node-version == '24.x' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
      run: |
        mkdir -p release-assets
        cp LICENSE dist/LICENSE
        node --input-type=module <<'JS'
        import { readFileSync, writeFileSync } from 'node:fs'
        const { version } = JSON.parse(readFileSync('package.json', 'utf8'))
        if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid release version')
        writeFileSync('dist/release.json', JSON.stringify({ version, revision: process.env.GITHUB_SHA }, null, 2) + '\n')
        JS
        release_version=$(node -p "require('./package.json').version")
        tar -czf "release-assets/go-admin-ui-v${release_version}-dist.tar.gz" dist
        cd release-assets
        sha256sum "go-admin-ui-v${release_version}-dist.tar.gz" > SHA256SUMS

    - name: Upload release candidate
      if: matrix.node-version == '24.x' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: go-admin-ui-dist-${{ github.sha }}
        path: release-assets/*
        if-no-files-found: error
        retention-days: 30
